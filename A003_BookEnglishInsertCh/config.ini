[OriginalConfigPath]
OriginalBookPath = ./original
OutputBookPath = ./Output
WorkPath = ./tmp_cache

[RuntimeConfig]
CaculateCore = CPU
# Total CPU worker budget. 0 = auto. Uses available CPU cores, or BOOKVOCAB_MAX_WORKERS when exported.
MaxWorkers = 0
# Book-level parallelism. Keep this 1 on CPU so Ollama does not compete with PDF OCR from another book.
BookWorkers = 1
# OCR page workers per PDF book. 0 = use the remaining CPU worker budget.
OcrWorkers = 0

[DifficultyConfig]
AdvancedLevels = C1,C2
MinCandidateLength = 5
B1MinLength = 8
B1FrequencyThreshold = 0.000003
B2MinLength = 8
B2FrequencyThreshold = 0.000012
UnknownMinLength = 8
UnknownFrequencyThreshold = 0.000003

[TranslationConfig]
SegmentsPerTranslation = 1
UseContextMeaning = 1
MaxMeaningChars = 8
RetryOnVerboseMeaning = 1
AmbiguousMeaningPolicy = skip
OllamaTemperature = 0
OllamaModel = qwen2.5:7b
TranslationRepeatWindowWords = 250
TranslationBatchSize = 8
MaxContextChars = 1800
OllamaTimeoutSeconds = 240
OllamaRequestRetries = 2
OllamaRetrySleepSeconds = 3
IpaProvider = auto

[ProperNounConfig]
SkipProperNouns = 1
NlpModel = en_core_web_sm
EntityLabels = PERSON,GPE,LOC,FAC,ORG
SkipWords = 

[OcrConfig]
EnablePdfOcr = 1
ForcePdfOcr = 1
OcrLanguage = eng
PdfDpi = 300
TesseractPsm = 1
MinPdfTextChars = 200

[BookOutputConfig]
OutputFormat = azw3
InputSuffixes = .pdf,.epub,.mobi,.azw3,.azw,.txt,.html,.htm,.docx,.rtf
OverwriteOutput = 0
KeepIntermediate = 0
