[OriginalConfigPath]
# Input books are read from this directory unless --input or --input-dir is passed.
OriginalBookPath = ./original
# Finished books are written here unless --output-dir is passed.
OutputBookPath = ./Output
# Resume cache and intermediate work files are stored here.
WorkPath = ./tmp_cache

[RuntimeConfig]
# Set RunMode = local to process only on this machine.
# Set RunMode = remote to split work across the SSH workers in [RemoteConfig].
RunMode = remote
# CPU is the default. GPU selects CUDA paths when the environment supports them.
CaculateCore = CPU
# 0 means auto-detect available CPU cores for local processing.
MaxWorkers = 0
# Number of books processed at the same time in local mode. 1 is safest.
BookWorkers = 1
# 0 means auto. Used for PDF OCR page workers per book.
OcrWorkers = 0

[RemoteConfig]
# This whole section is used only when RuntimeConfig.RunMode = remote.
# To switch to local mode, change only RuntimeConfig.RunMode to local.
# RemoteWorkers format: ssh_user@host:/absolute/project/path or ssh_user@host:~/project/path.
RemoteWorkers = 
	neu@172.30.2.221:/home/neu/A003_BookEnglishInsertCh,
	neu@172.30.2.212:/home/neu/A003_BookEnglishInsertCh,
	neu@172.30.2.213:/home/neu/A003_BookEnglishInsertCh,
	ccs9@172.30.2.204:~/A003_BookEnglishInsertCh,
	neu@172.30.2.241:~/A003_BookEnglishInsertCh,
	neu@172.30.2.222:~/A003_BookEnglishInsertCh
# 1 keeps this machine as one worker when RunMode = remote. Ignored in local mode.
RemoteIncludeLocalWorker = 1
# Remote temporary work directory used on each SSH worker.
RemoteWorkPath = /tmp/bookvocab_remote
# Python executable on each remote project checkout.
RemotePython = ./venv/bin/python3
# 1 copies this project to each remote worker before processing.
RemoteSyncProject = 1
# 1 runs EnvSetup/SetupCPU.sh on remote workers when required tools are missing.
RemoteSetupIfMissing = 1
# Extra ssh/scp options used for remote workers. BatchMode prevents unattended
# runs from blocking on a password or passphrase prompt.
RemoteSshOptions = -o BatchMode=yes -o NumberOfPasswordPrompts=0 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -o ConnectionAttempts=1 -o ServerAliveInterval=30 -o ServerAliveCountMax=3
# Directory for persistent SSH control sockets.
RemoteSshControlPath = /tmp/bookvocab_remote_ssh
# Keep authenticated SSH sessions for 72 hours. 259200 seconds = 72 hours.
RemoteSshControlPersistSeconds = 259200
# Retry count for failed SSH control sessions. Keep this low for unattended runs.
RemoteSshPasswordRetries = 1
# Seconds without remote output before a worker is treated as stalled. 0 disables it.
RemoteNoResponseTimeoutSeconds = 120
# Capacity controls for remote scheduling.
RemoteMemoryReservePercent = 15
RemoteMinFreeMemoryMB = 2048
RemoteMemoryPerJobMB = 4096
RemoteCpuPerJob = 2
RemoteMaxJobsPerHost = 1
RemoteChunksPerSlot = 16

[DifficultyConfig]
AdvancedLevels = C1,C2
MinCandidateLength = 5
B1MinLength = 8
B1FrequencyThreshold = 0.000003
B2MinLength = 8
B2FrequencyThreshold = 0.000012
UnknownMinLength = 8
UnknownFrequencyThreshold = 0.000003

[TranslationConfig]
# Number of source segments translated together per request.
SegmentsPerTranslation = 1
# 1 includes context when asking Ollama for short Chinese meanings.
UseContextMeaning = 1
MaxMeaningChars = 8
RetryOnVerboseMeaning = 1
AmbiguousMeaningPolicy = skip
OllamaTemperature = 0
# Local mode normally uses localhost. In remote mode, localhost means each worker's own Ollama.
OllamaApi = http://localhost:11434/api/generate
OllamaModel = qwen2.5:7b
TranslationRepeatWindowWords = 250
TranslationBatchSize = 8
MaxContextChars = 1800
OllamaTimeoutSeconds = 120
OllamaRequestRetries = 1
OllamaRetrySleepSeconds = 3
SkipOnServiceUnavailable = 1
FailOnServiceUnavailable = 0
ServiceUnavailableFailureLimit = 1
IpaProvider = auto

[ProperNounConfig]
SkipProperNouns = 1
NlpModel = en_core_web_sm
EntityLabels = PERSON,GPE,LOC,FAC,ORG
SkipWords = 

[OcrConfig]
# Enable OCR for PDFs. ForcePdfOcr = 1 runs OCR even if a text layer exists.
EnablePdfOcr = 1
ForcePdfOcr = 1
OcrLanguage = eng
PdfDpi = 300
TesseractPsm = 1
MinPdfTextChars = 200

[BookOutputConfig]
# Current pipeline output format. main_batch.py currently requires azw3.
OutputFormat = azw3
# File types discovered when scanning OriginalBookPath.
InputSuffixes = .pdf,.epub,.mobi,.azw3,.azw,.txt,.html,.htm,.docx,.rtf
# 0 skips books whose output file already exists.
OverwriteOutput = 0
# 0 still keeps resume cache, but avoids treating intermediate artifacts as final outputs.
KeepIntermediate = 0
